appearance:
  theme: dark
  icon:
    set: monochrome
    transparency:
      light: 1.0
      dark: 0.85
    color:
      dark: '#cfd8dc'
  font:
    face: Noto Sans
    color:
      light: '#eceff1'
      dark: '#90a4ae'
    transparency:
      light: 1.0
      dark: 1.0
  background:
    transparency: 0.55
    color: '#10161d'
  chart:
    colors:
      cpu: '#dfe7ef'
      memory: '#8fa8c8'
      net_down: '#c3cbd6'
      net_up: '#5c9dff'
    glow: false
  panel:
    background:
      color: '#10161d'
      transparency: 0.55
      gradient: 'linear-gradient(to bottom, #232d3a, #10161d)'
