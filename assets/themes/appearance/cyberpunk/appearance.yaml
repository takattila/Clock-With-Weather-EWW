appearance:
  theme: dark
  icon:
    set: monochrome
    transparency:
      light: 1.0
      dark: 0.9
    color:
      dark: '#fcee0a'
  font:
    face: Noto Sans
    color:
      light: '#fcee0a'
      dark: '#ff003c'
    transparency:
      light: 1.0
      dark: 1.0
    shadow:
      color: '#fcee0a'
      blur: 7
  background:
    transparency: 0.0
    color: '#0a0a14'
  chart:
    colors:
      cpu: '#fcee0a'
      memory: '#00fff9'
      net_down: '#ff003c'
      net_up: '#bf00ff'
    glow: true
