# ============================================================================
# Central configuration for the eww widget.
#
# The OpenWeatherMap API key is intentionally NOT here (it would land in git).
# Provide it via the OPENWEATHER_API_KEY environment variable or the local,
# git-ignored file ./.api_key (first line, chmod 600).
#
# LOCAL OVERRIDES: this file holds the portable defaults. Machine-specific
# values (and everything the widget scripts write, e.g. Move/Resize -> Save)
# live in the git-ignored config.local.yaml, deep-merged over this file
# (local keys win). Example override:
#
#     weather:
#       window:
#         per_monitor:
#           0: { scale: 0.85 }
#
# Edit this file only when you want to change a DEFAULT for every machine.
# ============================================================================

# appearance -> the color theme. Two forms are accepted:
#
#   1. A theme NAME (string) -> uses themes/appearance/<name>/appearance.yaml,
#      e.g.: appearance: light | dark | dark-orange-bg | neon | neon-bg |
#      pastel | sunset-basic | candy-pastel | aurora | cyberpunk |
#      rose-gold | titanium | ...
#
#   2. A custom map (object) -> inline appearance definition, e.g.:
#
#      appearance:
#        theme: light           # image folder under images/theme/<theme>/ (light | dark)
#        icon:
#          set: dovora          # icon set under images/theme/<theme>/weather/<set>/
#          color:               # icon color (tinted into the PNGs)
#            light: '#ffffff'   #   used when theme is "light"
#            dark: '#9e9e9e'    #   used when theme is "dark"
#          transparency:        # icon opacity (applied to all icons)
#            light: 1.0         #   when theme is "light"
#            dark: 0.5          #   when theme is "dark"
#        font:
#          face: Noto Sans
#          color:
#            light: '#ffffff'   # main text color ($color-light)
#            dark: '#9e9e9e'    # secondary text color ($color-dark)
#          transparency:
#            light: 1.0         # opacity of $color-light texts
#            dark: 1.0          # opacity of $color-dark texts
#          shadow:              # optional neon text glow (clock digits +
#            color: '#00e5ff'   #   panel titles, GTK text-shadow)
#            blur: 8
#        background:
#          transparency: 0.0    # 0.0 = fully transparent, 1.0 = opaque
#          color: '#000000'
#        chart:                 # optional style keys (v3.0.0) - all fall back
#          colors:              #   to the classic single-color look
#            cpu: '#ff8c00'     # per-chart colors; the matching panel title
#            memory: '#9acd32'  #   follows the same color; missing entries
#            net_down: '#ff2fa0'#   use font.color.light
#            net_up: '#2f9bff'
#          glow: false          # neon glow stroke under the chart lines
#        panel:
#          background:          # the panel's own background; missing
#            color: '#1a120b'   #   color/transparency fall back to the
#            transparency: 0.45 #   widget background above
#            gradient: ~        # optional GTK CSS background-image, e.g.
#                               # linear-gradient(to bottom, #1b3a5c, #0d1f33)
#

# appearance -> active appearance theme (see the options above).
appearance: light

# weather -> weather widget (clock) settings. Two forms are accepted.
weather:

  # name -> which city settings to use. Options: default | budapest | berlin |
  #         any directory name under assets/themes/weather/<name>/weather.yaml.
  #         OMIT this key to define the city settings inline below (see the
  #         comment above), e.g.:
  #
  #         weather:
  #           city: Tatabánya
  #           language_code: hu
  #           lang: hu
  #           units: metric
  #           api_url: https://api.openweathermap.org/data/2.5/weather
  #
  #         The two forms also mix: when `name` is set, the theme provides the
  #         baseline values and inline fields patch on top of it — handy for
  #         config.local.yaml overrides (e.g. keep `name: default` here and
  #         override just the units or the whole city locally).

  name: default

  # window -> position of the clock widget on the screen.
  window:

    # alignment -> where the clock is anchored.
    # Options: top_left | top_right | top_middle | bottom_left | bottom_right |
    #          bottom_middle | middle_left | middle_right | middle_middle
    alignment: middle_middle

    # position_x / position_y / scale are NOT set globally anymore: they are
    # stored per monitor only, under per_monitor below (the right-click
    # Move/Resize -> Save always writes there). Monitors without an entry use
    # the defaults: position 0/0, scale 1.0.
    #
    # The monitor index matches `eww open --screen N` (scripts/monitors.py),
    # e.g.:
    #   per_monitor:
    #     0: { position_x: 0, position_y: 0, scale: 0.90 }
    #     1: { position_x: -40, position_y: 20, scale: 0.8 }
    #
    # INDEPENDENT WIDTH/HEIGHT SCALES (optional): the Move/Resize dialog can
    # also resize width and height separately ("W"/"H" rows, Shift+arrow
    # keys, edge-drag). Those saves write `scale_x` / `scale_y` here; each
    # axis falls back to the shared `scale` when missing, so entries without
    # them keep scaling both axes uniformly:
    #   per_monitor:
    #     0: { position_x: 0, position_y: 0, scale_x: 1.00, scale_y: 0.80 }
    per_monitor:
      0:
        position_x: 0
        position_y: 0
        scale: 1.00

# system -> global configuration affecting all widgets.
#           Controls shared behavior such as time format and background
#           corner rounding for both the weather widget and the system panel.
system:

  # hour_format -> how the hour is displayed.
  #                Options: "24" (e.g. 23:15) | "12" (e.g. 11:15, with a small
  #                AM/PM indicator under the hour digits)
  hour_format: "24"

  # corner_radius -> background corner rounding in px for BOTH widgets.
  #                  Options: 0 (square) | any positive integer
  corner_radius: 15

# panel -> system monitor panel settings.
panel:

  # enabled -> whether the system monitor panel is started.
  #            Options: true | false
  enabled: true

  # window -> panel window settings.
  window:

    # alignment -> horizontal side of the full-height panel.
    #              Options: right (default, flush right) | left (flush left)
    alignment: right
    # The panel's DEFAULT position and height are derived from panel.gap below
    # (scripts/workarea.py). position_x / position_y / scale are stored per
    # monitor only, under per_monitor below (same syntax as
    # weather.window.per_monitor). Monitors without an entry use the defaults:
    # no offset (0/0) and scale 1.0.
    #
    # position_x / position_y are pixel OFFSETS added to the gap-derived base
    # position (positive shifts the panel right / down on screen); the right-
    # click Move/Resize -> Save always writes them here. The gap values stay
    # global (the shared baseline). e.g.:
    #   per_monitor:
    #     0: { position_x: 0, position_y: 0, scale: 1.0 }
    #     1: { position_x: -40, position_y: 20, scale: 0.7 }
    #
    # INDEPENDENT WIDTH/HEIGHT SCALES (optional): same as for the weather
    # window above — Move/Resize saves that changed only one axis write
    # `scale_x` / `scale_y`; each axis falls back to `scale` when missing.
    per_monitor:
      0:
        position_x: 0
        position_y: 0
        scale: 1.00

  # gap -> spacing (px) between the panel and the screen/taskbar edges. This is
  #        the GLOBAL baseline position; per-monitor position_x/position_y
  #        offsets (panel.window.per_monitor) are added on top.
  #        Options: a single number (applies to every side), e.g. gap: 16
  #                 or a per-side map (braces and commas are optional), e.g.:
  #                 gap: { top: 5, bottom: 10, left: 0, right: 0 }
  #                 or:
  #                 gap:
  #                   top: 5
  #                   bottom: 5
  #                   left: 0
  #                   right: 0
  #        Missing sides default to 16 px.
  gap:
    top: 5
    bottom: 5
    left: 0
    right: 0
