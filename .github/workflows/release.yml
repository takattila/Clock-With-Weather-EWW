name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate changelog from git log
        id: changelog
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            RANGE="$PREV..HEAD"
          else
            RANGE=""
          fi
          {
            echo "### What's changed"
            echo
            git log --oneline --no-merges $RANGE
          } > /tmp/release-body.md
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release-body.md