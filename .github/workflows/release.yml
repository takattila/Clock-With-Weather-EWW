name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate changelog from git log
        id: changelog
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            git log --oneline --no-merges "$PREV..HEAD" > /tmp/changelog.txt
            echo "PREV=$PREV" >> "$GITHUB_ENV"
          else
            rm -f /tmp/changelog.txt
          fi
      - name: Assemble release body
        run: |
          if [ -f docs/RELEASE_NOTES.md ]; then
            cp docs/RELEASE_NOTES.md /tmp/release-body.md
          else
            echo "### What's changed" > /tmp/release-body.md
          fi
          if [ -f /tmp/changelog.txt ]; then
            {
              echo
              echo "---"
              echo
              echo "## Commits since $PREV"
              echo
              cat /tmp/changelog.txt
            } >> /tmp/release-body.md
          fi
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release-body.md